<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelime Kartı</title>
<meta name="description" content="Kelime listesini üstü örtülü kartlara çevirir; dosya cihazdan çıkmaz.">
<meta name="theme-color" content="#2f8f86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kelime Kartı">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root{
    color-scheme:light;
    --bg:#faf8f4; --surface:#ffffff; --surface-2:#f3f0ea; --border:#e4ddd0;
    --text:#241f18; --text-dim:#7a7266; --word:#a8330a; --anlam:#6a2fa0; --de:#0a5fa8; --tr:#1c7a4a;
    --code-bg:#efe9dc; --accent:#2f8f86; --cover:#2f8f86; --cover-2:#7fc4bd; --chip:#eef2ee;
    --warn:#c2410c; --shadow:0 1px 2px rgba(40,30,10,.06), 0 6px 16px rgba(40,30,10,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#171512; --surface:#211e19; --surface-2:#2a261f; --border:#3a352b;
      --text:#f1ece1; --text-dim:#a89e8c; --word:#ff8a5c; --anlam:#c79bff; --de:#7cc0ff; --tr:#7fe0ab;
      --code-bg:#332d22; --accent:#4fb3a8; --cover:#3a6e68; --cover-2:#5b9d94; --chip:#26322c;
      --warn:#fb923c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#171512; --surface:#211e19; --surface-2:#2a261f; --border:#3a352b;
    --text:#f1ece1; --text-dim:#a89e8c; --word:#ff8a5c; --anlam:#c79bff; --de:#7cc0ff; --tr:#7fe0ab;
    --code-bg:#332d22; --accent:#4fb3a8; --cover:#3a6e68; --cover-2:#5b9d94; --chip:#26322c;
    --warn:#fb923c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
  .page{max-width:760px;margin:0 auto}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer;border:1px solid var(--border);background:var(--surface);border-radius:999px;
    padding:6px 12px;font-size:14px;font-weight:600;line-height:1.2;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.96)}
  button.ikon{padding:6px 9px;min-width:36px}
  button.secili{background:var(--accent);color:#fff;border-color:transparent}
  select{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:15px;max-width:100%}
  .ses-satir{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
  [hidden]{display:none!important}

  /* ---------- ust cubuk */
  header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 0 8px;
    border-bottom:1px solid var(--border)}
  .satir{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .satir + .satir{margin-top:8px}
  #listeBtn{border:none;background:none;padding:4px 2px;font-family:"Fraunces",Georgia,serif;font-size:20px;
    font-weight:700;border-radius:8px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bosluk{flex:1}
  .grupkutu{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:999px;
    padding:2px 2px 2px 10px;background:var(--surface)}
  .grupkutu span{font-size:13px;font-weight:700;color:var(--text-dim);margin-right:4px}
  .grupkutu .kisa{display:none}
  .grupkutu button{border:none;padding:4px 8px;background:none}
  .grupkutu button.secili{background:var(--accent);color:#fff}
  .segment{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
  .segment button{border:none;border-radius:0;padding:5px 10px;background:none}
  .segment button.secili{background:var(--accent);color:#fff}
  .segment small{font-weight:400;opacity:.8;margin-left:3px}
  #ara{width:100%;margin-top:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:16px}
  .nokta{position:relative}
  .nokta::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}

  /* ---------- oturum ve kartlar */
  .oturum{margin-top:16px}
  .oturum-bas{display:flex;align-items:baseline;gap:8px;cursor:pointer;padding:4px 2px;user-select:none;-webkit-user-select:none}
  .oturum-bas .tarih{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:12px}
  .oturum-bas h2{font-size:14px;margin:0;font-weight:600;color:var(--text-dim);flex:1}
  .oturum-bas .ok{color:var(--text-dim);font-size:11px;transition:transform .15s}
  .oturum.kapali .ok{transform:rotate(-90deg)}
  .oturum.kapali .kartlar{display:none}
  .kartlar{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .kart{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
    padding:12px 14px 6px;display:flex;flex-direction:column;gap:6px;transition:opacity .25s}
  .kart.odak{outline:2px solid var(--accent);outline-offset:2px}
  .kart.gidiyor{opacity:0}
  .bolgeler{display:flex;flex-direction:column;gap:8px;min-width:0}
  .bolge{position:relative;border-radius:9px;cursor:pointer;min-height:28px}
  .bolge[data-g="2"]{background:var(--surface-2);padding:8px 10px}
  .bolge .ic{display:grid;gap:4px;line-height:1.45}
  .bolge.kapali .ic{visibility:hidden}
  .bolge .ort{display:none;position:absolute;inset:0;border-radius:9px;align-items:center;justify-content:center;
    color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.02em;
    background:repeating-linear-gradient(135deg,var(--cover-2) 0 10px,var(--cover) 10px 20px);opacity:.94}
  .bolge.kapali .ort{display:flex}
  .f-wort{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:19px;color:var(--word);overflow-wrap:anywhere}
  .f-satz{color:var(--de);font-size:15px}
  .f-anlam{color:var(--anlam);font-weight:600;font-size:15px}
  .f-ceviri{color:var(--tr);font-style:italic;font-size:14.5px}
  .f-not{color:var(--text-dim);font-size:13.5px}
  .f-x{font-size:14px}
  .f-x .ad{font-size:11px;color:var(--text-dim);font-weight:700;margin-right:5px}
  .bolge code{background:var(--code-bg);color:var(--word);padding:1px 5px;border-radius:4px;font-size:.92em}
  .isaretler{display:flex;gap:2px;justify-content:flex-end;margin-right:-6px}
  .isaretler button{border:none;background:none;padding:4px 8px;font-size:16px;min-width:34px;color:var(--text-dim);opacity:.55;border-radius:8px}
  .isaretler button.secili{opacity:1;color:var(--accent);background:var(--chip)}
  .isaretler button[data-a="fav"].secili{color:#d4a017}
  .bos-durum{text-align:center;color:var(--text-dim);padding:40px 10px}

  /* ---------- karsilama */
  .karsilama{text-align:center;padding:40px 10px}
  .karsilama h1{font-family:"Fraunces",Georgia,serif;font-size:28px;margin:0 0 8px}
  .karsilama p{color:var(--text-dim);max-width:460px;margin:8px auto;line-height:1.5}
  .karsilama button{margin:6px}
  button.ana{background:var(--accent);color:#fff;border-color:transparent;padding:10px 18px;font-size:16px}

  /* ---------- paneller */
  dialog{border:none;border-radius:16px;padding:0;background:var(--surface);color:var(--text);width:min(560px,94vw);
    max-height:86vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  .panel{padding:16px 18px 20px;overflow:auto;max-height:86vh}
  .panel h3{margin:0 0 4px;font-size:18px}
  .panel h4{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim)}
  .panel .kapat{float:right}
  .alan-satir{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
  .alan-satir .ad{flex:1}
  .alan-satir .bos{font-size:12px;color:var(--text-dim)}
  .panel .dugmeler{display:flex;flex-wrap:wrap;gap:8px}
  .panel p{margin:6px 0;line-height:1.45}
  .panel .soluk{color:var(--text-dim);font-size:13.5px}
  .liste-satir{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
  .liste-satir .ad{flex:1;cursor:pointer}
  .liste-satir .ad b{display:block}
  .liste-satir .ad small{color:var(--text-dim)}
  .sorun{font-size:13.5px;padding:3px 0}
  .sorun b{font-variant-numeric:tabular-nums}

  /* ---------- tek kart modu */
  body.calisiyor{overflow:hidden}
  #calis{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
  #calis[hidden]{display:none}
  .calis-ust{display:flex;align-items:center;gap:10px;max-width:760px;width:100%;margin:0 auto;font-size:14px}
  .calis-ust .ilerleme{font-variant-numeric:tabular-nums;font-weight:700}
  .calis-ust .kip-adi{color:var(--accent);font-weight:700}
  .calis-ust .sayac{flex:1;text-align:right;color:var(--text-dim);font-variant-numeric:tabular-nums}
  .calis-cubuk{height:3px;background:var(--surface-2);border-radius:2px;max-width:760px;width:100%;margin:8px auto 0;overflow:hidden}
  .calis-cubuk span{display:block;height:100%;background:var(--accent);transition:width .2s}
  .calis-govde{flex:1;overflow:auto;padding:14px 0}
  .kart.tek{max-width:760px;margin:0 auto;padding:18px 18px 8px;gap:12px}
  .kart.tek .f-wort{font-size:26px}
  .kart.tek .f-satz,.kart.tek .f-anlam{font-size:17px}
  .kart.tek .bolge{cursor:default}
  .cevap2{background:var(--surface-2);padding:10px 12px}
  .test-tur{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
  .test-soru{font-size:19px;line-height:1.45}
  .secenekler{display:grid;gap:8px}
  .secenek{display:flex;align-items:center;gap:10px;text-align:left;border-radius:12px;padding:11px 12px;font-size:16px;
    font-weight:500;background:var(--surface);border:1.5px solid var(--border)}
  .secenek kbd{font:700 12px/1 "Source Sans 3",sans-serif;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;
    padding:3px 6px;color:var(--text-dim);text-transform:uppercase}
  .secenek.secili{border-color:var(--accent);background:var(--chip)}
  .secenek.dogru{border-color:#2e9e5b;background:rgba(46,158,91,.14);font-weight:700}
  .secenek.yanlis{border-color:#d33;background:rgba(221,51,51,.12);text-decoration:line-through}
  .secenek.kacan{border-color:#2e9e5b;border-style:dashed}
  .secenek.soluk{opacity:.55}
  .ortala{text-align:center}
  .yaz input{width:100%;font-size:18px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface)}
  .yaz input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .fark{display:grid;gap:6px;font-size:18px;background:var(--surface-2);border-radius:10px;padding:10px 12px;letter-spacing:.02em}
  .fark small{display:inline-block;width:52px;font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:0;text-transform:uppercase}
  .fark .ayni{font-size:13px;color:#2e9e5b;font-weight:700}
  .h-yanlis{color:#d33;font-weight:800;text-decoration:underline wavy #d33}
  .h-eksik{color:var(--text-dim);opacity:.8;text-decoration:underline 2px #e08a00;text-underline-offset:3px}
  .h-fazla{color:#d33;text-decoration:line-through 2px}
  .h-buyuk{color:#e08a00;font-weight:800}
  .h-nokta{background:var(--code-bg);border:1px solid var(--border);border-radius:3px;padding:0 2px;color:var(--text-dim)}
  .cevap-bilgi{display:grid;gap:6px}
  .calis-alt{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:760px;width:100%;
    margin:0 auto;padding:10px 0 max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--border)}
  .calis-alt button{padding:11px 18px;font-size:16px}
  .calis-alt button.genis{flex:1;max-width:420px}
  .calis-alt kbd,.kipler kbd{font:600 11px/1 "Source Sans 3",sans-serif;opacity:.7;margin-left:4px}
  .calis-alt button.iyi{background:#2e9e5b;color:#fff;border-color:transparent;flex:1;max-width:240px}
  .calis-alt button.kotu{background:#d33;color:#fff;border-color:transparent;flex:1;max-width:240px}
  .calis-alt .sonuc{font-weight:700;font-size:16px}
  .sonuc.iyi,.ozet .iyi{color:#2e9e5b}.sonuc.kotu,.ozet .kotu{color:#d33}
  .ozet{text-align:center;padding:28px 18px}
  .ozet h2{font-family:"Fraunces",Georgia,serif;margin:0}
  .ozet .buyuk{font-size:20px;font-weight:700}
  .isaretler button[data-a="hata"].secili{color:var(--warn)}
  .kipler{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kipler .kip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border-radius:12px;padding:12px;text-align:left}
  .kipler .kip b{font-size:16px}
  .kipler .kip small{font-weight:400;font-size:12.5px;opacity:.85}
  .kipler .kip:disabled{opacity:.45;cursor:default}
  .turler{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
  .turler small{color:var(--text-dim)}

  /* ---------- bildirim */
  #bildirim{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;
    background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:12px;
    align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:92vw}
  #bildirim button{background:none;border:1px solid currentColor;color:inherit;padding:4px 10px}

  @media (max-width:480px){
    #listeBtn{font-size:18px}
    .f-wort{font-size:18px}
    .grupkutu .uzun{display:none}
    .grupkutu .kisa{display:inline}
    .grupkutu{padding-left:8px}
    .segment button{padding:5px 8px}
  }
</style>
</head>
<body>
<div class="page">
  <header class="top" id="ust" hidden>
    <div class="satir">
      <button id="listeBtn" title="Listeler">Kelime Kartı ▾</button>
      <span class="bosluk"></span>
      <button class="ikon" id="calisBtn" title="Çalış: tek kart, Aç-bak / Yaz / Seç / Test (C)">▶</button>
      <button class="ikon" id="araBtn" title="Ara (/)">🔍</button>
      <button class="ikon" id="karBtn" title="Karıştır">🔀</button>
      <button class="ikon" id="bilgiBtn" title="Bilgi">ⓘ</button>
      <button class="ikon" id="ayarBtn" title="Ayarlar">⚙</button>
    </div>
    <div class="satir">
      <span class="grupkutu" title="Grup 1"><span class="uzun">Grup 1</span><span class="kisa">G1</span>
        <button data-grup="1" data-acik="1" title="Grup 1: tümünü göster">👁</button>
        <button data-grup="1" data-acik="0" title="Grup 1: tümünü gizle">🙈</button></span>
      <span class="grupkutu" title="Grup 2"><span class="uzun">Grup 2</span><span class="kisa">G2</span>
        <button data-grup="2" data-acik="1" title="Grup 2: tümünü göster">👁</button>
        <button data-grup="2" data-acik="0" title="Grup 2: tümünü gizle">🙈</button></span>
      <span class="bosluk"></span>
      <span class="segment" id="suzgec">
        <button data-s="hepsi">Hepsi</button>
        <button data-s="tekrar" title="Sık ve seyrek tekrar">↻<small></small></button>
        <button data-s="fav" title="Favoriler">★<small></small></button>
        <button data-s="ok" title="Öğrenilenler">✓<small></small></button>
      </span>
    </div>
    <input id="ara" type="search" placeholder="Ara…" hidden autocomplete="off">
  </header>

  <main id="ana"></main>
</div>

<input type="file" id="dosya" multiple hidden>

<dialog id="ayarPanel"><div class="panel" id="ayarIc"></div></dialog>
<dialog id="bilgiPanel"><div class="panel" id="bilgiIc"></div></dialog>
<dialog id="listePanel"><div class="panel" id="listeIc"></div></dialog>
<dialog id="calisPanel"><div class="panel" id="calisIc"></div></dialog>
<div id="calis" hidden></div>
<div id="bildirim" hidden></div>

<script src="parse.js"></script>
<script src="app.js"></script>
</body>
</html>
